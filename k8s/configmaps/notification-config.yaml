apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: arogya
data:
  NODE_ENV: "production"
  PORT: "3002"
  PATIENT_SERVICE_URL: "http://patient-service:8082"
  DOCTOR_SERVICE_URL: "http://doctor-service:8083"
  SENDGRID_FROM_EMAIL: "noreply@arogya.health"
  SENDGRID_FROM_NAME: "Arogya Health"
  RETRY_ATTEMPTS: "3"
  RETRY_DELAY_MS: "1000"
