# =============================================================================
# Arogya - Docker Compose Development Environment
# =============================================================================
# Usage:
#   Start:  docker compose -f infrastructure/docker/docker-compose.dev.yml up -d
#   Stop:   docker compose -f infrastructure/docker/docker-compose.dev.yml down
#   Reset:  docker compose -f infrastructure/docker/docker-compose.dev.yml down -v
#
# Or use the Makefile shortcuts:
#   make dev    — start all infrastructure
#   make down   — stop all
#   make reset  — stop and remove all volumes
# =============================================================================

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  arogya-net:
    driver: bridge
    name: arogya-net

# ---------------------------------------------------------------------------
# Volumes (persistent data)
# ---------------------------------------------------------------------------
volumes:
  postgres-data:
    name: arogya-postgres-data
  mongodb-data:
    name: arogya-mongodb-data

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:
  # -------------------------------------------------------------------------
  # PostgreSQL — Relational data store
  # Internal hostname: postgres
  # Connection string: jdbc:postgresql://postgres:5432/<db_name>
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: arogya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arogya
      POSTGRES_PASSWORD: arogya_secret
      POSTGRES_MULTIPLE_DATABASES: arogya_users,arogya_appointments,arogya_prescriptions,arogya_patients
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    ports:
      - "5433:5432"
    networks:
      - arogya-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arogya"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------------------
  # MongoDB — Document store (prescriptions, telemedicine session data)
  # Internal hostname: mongodb
  # Connection string: mongodb://mongodb:27017/<db_name>
  # -------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: arogya-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: arogya
      MONGO_INITDB_ROOT_PASSWORD: arogya_secret
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - arogya-net
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ===========================================================================
  # APPLICATION SERVICES
  # Uncomment each block individually as you implement the service.
  # Make sure to build the Docker image first:
  #   docker build -t arogya/<service-name>:latest apps/<service-name>/
  # ===========================================================================

  # -------------------------------------------------------------------------
  # API Gateway — Port 8080
  # Uncomment when apps/api-gateway/ has a working Dockerfile and src/
