  #     SPRING_DATASOURCE_PASSWORD: arogya_secret
  #     SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  #     JWT_SECRET: changeme-use-a-real-256bit-secret-in-production
  #   ports:
  #     - "8081:8081"
  #   networks:
  #     - arogya-net

  # -------------------------------------------------------------------------
  # Appointment Service — Port 8084
  # -------------------------------------------------------------------------
  appointment-service:
    image: arogya/appointment-service:latest
    container_name: arogya-appointment-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: changeme-use-a-real-256bit-secret-in-production
    ports:
      - "8084:8084"
    networks:
      - arogya-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8084/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -------------------------------------------------------------------------
  # Telemedicine Service — Port 8086
  # Uncomment when apps/telemedicine-service/ has a working Dockerfile and src/
  # -------------------------------------------------------------------------
  telemedicine-service:
    image: arogya/telemedicine-service:latest
    container_name: arogya-telemedicine-service
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: 8086
      NODE_ENV: production
      MONGODB_URI: mongodb+srv://db_user:yNayrTCfwh6CAd7V@cluster0.wmuelho.mongodb.net/?appName=Cluster0
      JITSI_BASE_URL: https://meet.jit.si
      # Add other service URLs as needed
      PATIENT_SERVICE_URL: http://patient-service:8082
      DOCTOR_SERVICE_URL: http://doctor-service:8083
      APPOINTMENT_SERVICE_URL: http://appointment-service:8084
      REQUEST_TIMEOUT_MS: 5000
      ROOM_DEFAULT_EXPIRY_HOURS: 24
    ports:
      - "8086:8086"
    networks:
      - arogya-net

  # -------------------------------------------------------------------------
  # Notification Service — Port 8085
  # Uncomment when apps/notification-service/ has a working Dockerfile and src/
  # -------------------------------------------------------------------------
