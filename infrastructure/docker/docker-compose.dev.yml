  #   networks:
  #     - arogya-net
  #   healthcheck:
  #     test: ["CMD-SHELL", "wget -qO- http://localhost:8089/health || exit 1"]
  #     interval: 15s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 20s

  # -------------------------------------------------------------------------
  # Patient Service - Port 8082
  # -------------------------------------------------------------------------
  patient-service:
    build:
      context: ../../apps/patient-service
      dockerfile: Dockerfile
    image: arogya/patient-service:latest
    container_name: arogya-patient-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8082
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/arogya_patients
      SPRING_DATASOURCE_USERNAME: arogya
      SPRING_DATASOURCE_PASSWORD: arogya_secret
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8082"
    networks:
      - arogya-net

      # Doctor Service — Port 8083
  doctor-service:
    image: arogya/doctor-service:latest
    container_name: arogya-doctor-service
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/arogya_doctors
      - SPRING_DATASOURCE_USERNAME=arogya
      - SPRING_DATASOURCE_PASSWORD=arogya_secret
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - AUTH_SERVICE_URL=http://auth-service:8081
    depends_on:
      - postgres
    networks:
      - arogya-net
