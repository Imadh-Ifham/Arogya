  #       condition: service_healthy
  #     kafka:
  #       condition: service_healthy
  #   environment:
  #     SERVER_PORT: 8081
  #     SPRING_PROFILES_ACTIVE: docker
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/arogya_users
  #     SPRING_DATASOURCE_USERNAME: arogya
  #     SPRING_DATASOURCE_PASSWORD: arogya_secret
  #     SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  #     JWT_SECRET: changeme-use-a-real-256bit-secret-in-production
  #   ports:
  #     - "8081:8081"
  #   networks:
  #     - arogya-net

  # -------------------------------------------------------------------------
  # Appointment Service — Port 8084
  # -------------------------------------------------------------------------
  appointment-service:
    image: arogya/appointment-service:latest
    container_name: arogya-appointment-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: changeme-use-a-real-256bit-secret-in-production
    ports:
      - "8084:8084"
    networks:
      - arogya-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -------------------------------------------------------------------------
  # Prescription Service — Port 8083
  # Uncomment when apps/prescription-service/ has a working Dockerfile and src/
  # -------------------------------------------------------------------------
  # prescription-service:
  #   image: arogya/prescription-service:latest
  #   container_name: arogya-prescription-service
