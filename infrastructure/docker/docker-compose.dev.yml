  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     mongodb:
  #       condition: service_healthy
  #     kafka:
  #       condition: service_healthy
  #   environment:
  #     SERVER_PORT: 8083
  #     SPRING_PROFILES_ACTIVE: docker
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/arogya_prescriptions
  #     SPRING_DATASOURCE_USERNAME: arogya
  #     SPRING_DATASOURCE_PASSWORD: arogya_secret
  #     SPRING_DATA_MONGODB_URI: mongodb://arogya:arogya_secret@mongodb:27017/arogya_prescriptions?authSource=admin
  #     SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  #     KAFKA_TOPIC_PRESCRIPTION_ISSUED: prescription.issued
  #   ports:
  #     - "8083:8083"
  #   networks:
  #     - arogya-net

  # -------------------------------------------------------------------------
  # Telemedicine Service — Port 8084
  # Uncomment when apps/telemedicine-service/ has a working Dockerfile and src/
  # -------------------------------------------------------------------------
  # telemedicine-service:
  #   image: arogya/telemedicine-service:latest
  #   container_name: arogya-telemedicine-service
  #   restart: unless-stopped
  #   depends_on:
  #     mongodb:
  #       condition: service_healthy
  #     kafka:
  #       condition: service_healthy
  #   environment:
  #     PORT: 8084
  #     NODE_ENV: production
  #     KAFKA_BROKER: kafka:9092
  #     KAFKA_GROUP_ID: telemedicine-group
  #     KAFKA_TOPIC_CONSULTATION_STARTED: consultation.started
  #     MONGO_URI: mongodb://arogya:arogya_secret@mongodb:27017/arogya_telemedicine?authSource=admin
  #   ports:
  #     - "8084:8084"
  #   networks:
  #     - arogya-net

  # -------------------------------------------------------------------------
  # Notification Service — Port 8085
  # Uncomment when apps/notification-service/ has a working Dockerfile and src/
  # -------------------------------------------------------------------------
  # notification-service:
  #   image: arogya/notification-service:latest
  #   container_name: arogya-notification-service
  #   restart: unless-stopped
  #   depends_on:
  #     kafka:
  #       condition: service_healthy
  #   environment:
  #     PORT: 8085
  #     NODE_ENV: production
  #     KAFKA_BROKER: kafka:9092
  #     KAFKA_GROUP_ID: notification-group
  #     KAFKA_TOPICS: appointment.created,prescription.issued,consultation.started
  #     SMTP_HOST: smtp.example.com
  #     SMTP_PORT: 587
  #     SMTP_USER: notifications@arogya.health
  #     SMTP_PASS: changeme
  #   ports:
  #     - "8085:8085"
  #   networks:
  #     - arogya-net

  # -------------------------------------------------------------------------
  # Auth Service — Port 8081
  # -------------------------------------------------------------------------
  auth-service:
    image: arogya/auth-service:latest
    container_name: arogya-auth-service
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8081
      MONGODB_URI: mongodb://arogya:arogya_secret@mongodb:27017/arogya_auth?authSource=admin
      JWT_SECRET: changeme-use-a-real-256bit-secret-in-production
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: changeme-use-a-different-256bit-secret-in-production
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 12
    ports:
      - "8081:8081"
    networks:
      - arogya-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/api/auth/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -------------------------------------------------------------------------
  # Doctor Service — Port 8083
  # -------------------------------------------------------------------------
