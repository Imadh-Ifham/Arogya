# =============================================================================
# Arogya - Docker Compose Development Environment
# =============================================================================
# Usage:
#   Start:  docker compose -f infrastructure/docker/docker-compose.dev.yml up -d
#   Stop:   docker compose -f infrastructure/docker/docker-compose.dev.yml down
#   Reset:  docker compose -f infrastructure/docker/docker-compose.dev.yml down -v
#
# Or use the Makefile shortcuts:
#   make dev    — start all infrastructure
#   make down   — stop all
#   make reset  — stop and remove all volumes
# =============================================================================

version: "3.9"

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  arogya-net:
    driver: bridge
    name: arogya-net

# ---------------------------------------------------------------------------
# Volumes (persistent data)
# ---------------------------------------------------------------------------
volumes:
  postgres-data:
    name: arogya-postgres-data
  mongodb-data:
    name: arogya-mongodb-data
  kafka-data:
    name: arogya-kafka-data
  zookeeper-data:
    name: arogya-zookeeper-data
  zookeeper-log:
    name: arogya-zookeeper-log

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:
  # -------------------------------------------------------------------------
  # PostgreSQL — Relational data store
  # Internal hostname: postgres
  # Connection string: jdbc:postgresql://postgres:5432/<db_name>
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: arogya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arogya
      POSTGRES_PASSWORD: arogya_secret
      POSTGRES_MULTIPLE_DATABASES: arogya_users,arogya_appointments,arogya_prescriptions,arogya_doctors
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    ports:
      - "5432:5432"
    networks:
      - arogya-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arogya"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------------------
  # MongoDB — Document store (prescriptions, telemedicine session data)
  # Internal hostname: mongodb
  # Connection string: mongodb://mongodb:27017/<db_name>
  # -------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: arogya-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: arogya
      MONGO_INITDB_ROOT_PASSWORD: arogya_secret
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - arogya-net
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -------------------------------------------------------------------------
  # Zookeeper — Required by Kafka for broker coordination
  # -------------------------------------------------------------------------
  # zookeeper:
  #   image: confluentinc/cp-zookeeper:7.6.0
  #   container_name: arogya-zookeeper
  #   restart: unless-stopped
  #   environment:
  #     ZOOKEEPER_CLIENT_PORT: 2181
  #     ZOOKEEPER_TICK_TIME: 2000
  #     ZOOKEEPER_SYNC_LIMIT: 2
  #   volumes:
  #     - zookeeper-data:/var/lib/zookeeper/data
  #     - zookeeper-log:/var/lib/zookeeper/log
  #   ports:
  #     - "2181:2181"
  #   networks:
  #     - arogya-net
  #   healthcheck:
  #     test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep Zookeeper"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 10s

  # -------------------------------------------------------------------------
  # Kafka — Message broker (single node dev configuration)
  # Internal hostname: kafka
  # Bootstrap server (inside docker network): kafka:9092
  # Bootstrap server (from host machine):     localhost:9093
  # -------------------------------------------------------------------------
  # kafka:
  #   image: confluentinc/cp-kafka:7.6.0
  #   container_name: arogya-kafka
  #   restart: unless-stopped
  #   depends_on:
  #     zookeeper:
  #       condition: service_healthy
  #   environment:
  #     KAFKA_BROKER_ID: 1
  #     KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  #     # Listener for internal docker network (service-to-service)
  #     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  #     KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
  #     KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
  #     KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  #     # Topic settings
  #     KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  #     KAFKA_NUM_PARTITIONS: 3
  #     KAFKA_DEFAULT_REPLICATION_FACTOR: 1
  #     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  #     KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
  #     KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  #     KAFKA_LOG_RETENTION_HOURS: 168
  #     KAFKA_LOG_SEGMENT_BYTES: 1073741824
  #     KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
  #   volumes:
  #     - kafka-data:/var/lib/kafka/data
  #   ports:
  #     - "9093:9093"
  #   networks:
  #     - arogya-net
  #   healthcheck:
  #     test:
  #       [
  #         "CMD-SHELL",
  #         "kafka-broker-api-versions --bootstrap-server localhost:9092",
  #       ]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 10
  #     start_period: 30s

  # -------------------------------------------------------------------------
  # Kafka UI — Web interface for browsing topics, messages, and consumers
  # Access at: http://localhost:8090
  # -------------------------------------------------------------------------
  # kafka-ui:
  #   image: provectuslabs/kafka-ui:latest
  #   container_name: arogya-kafka-ui
  #   restart: unless-stopped
  #   depends_on:
  #     kafka:
  #       condition: service_healthy
  #   environment:
  #     KAFKA_CLUSTERS_0_NAME: arogya-local
  #     KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
  #     KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
  #     AUTH_TYPE: disabled
  #   ports:
  #     - "8090:8080"
  #   networks:
  #     - arogya-net

  # ===========================================================================
  # APPLICATION SERVICES
  # Uncomment each block individually as you implement the service.
  # Make sure to build the Docker image first:
  #   docker build -t arogya/<service-name>:latest apps/<service-name>/
  # ===========================================================================

  # -------------------------------------------------------------------------
  # API Gateway — Port 3000 (internal) → 3000 (host)
  # Build: docker build -t arogya/api-gateway:latest apps/api-gateway/
  # -------------------------------------------------------------------------
  api-gateway:
    build:
      context: ../../apps/api-gateway
      dockerfile: Dockerfile
    image: arogya/api-gateway:latest
    container_name: arogya-api-gateway
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      appointment-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Must match the JWT_SECRET used by auth-service
      JWT_SECRET: changeme-use-a-real-256bit-secret-in-production
      # Internal Docker network hostnames
      AUTH_SERVICE_URL: http://auth-service:8081
      APPOINTMENT_SERVICE_URL: http://appointment-service:8084
    ports:
      - "3000:3000"
    networks:
      - arogya-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -------------------------------------------------------------------------
  # Web Frontend — Vite dev server — Port 5173
  # Build: docker build -t arogya/web:latest apps/web/
  # -------------------------------------------------------------------------
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    image: arogya/web:latest
    container_name: arogya-web
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      # Vite proxy forwards /api/* to this URL inside the Docker network
      GATEWAY_URL: http://api-gateway:3000
    ports:
      - "5173:5173"
    networks:
      - arogya-net

  # -------------------------------------------------------------------------
  # User Service — Port 8081
  # Uncomment when apps/user-service/ has a working Dockerfile and src/
  # -------------------------------------------------------------------------
  # user-service:
  #   image: arogya/user-service:latest
  #   container_name: arogya-user-service
