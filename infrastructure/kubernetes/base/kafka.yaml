---
# =============================================================================
# Arogya — Kafka Kubernetes Manifests (single-node dev configuration)
# Namespace: arogya
# =============================================================================
# Apply:  kubectl apply -f infrastructure/kubernetes/base/kafka.yaml
# =============================================================================

# ---------------------------------------------------------------------------
# Zookeeper Deployment
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: arogya
  labels:
    app: zookeeper
    app.kubernetes.io/part-of: arogya-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.6.0
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"

---
# ---------------------------------------------------------------------------
# Zookeeper Service
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: arogya
  labels:
    app: zookeeper
spec:
  selector:
    app: zookeeper
  ports:
    - name: zookeeper
      protocol: TCP
      port: 2181
      targetPort: 2181
  type: ClusterIP

---
# ---------------------------------------------------------------------------
# Kafka Deployment
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: arogya
  labels:
    app: kafka
    app.kubernetes.io/part-of: arogya-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.0
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "INTERNAL:PLAINTEXT"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "INTERNAL://kafka:9092"
            - name: KAFKA_LISTENERS
              value: "INTERNAL://0.0.0.0:9092"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"

---
# ---------------------------------------------------------------------------
# Kafka Service
# Bootstrap address inside cluster: kafka:9092
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: arogya
  labels:
    app: kafka
spec:
  selector:
    app: kafka
  ports:
    - name: kafka
      protocol: TCP
      port: 9092
      targetPort: 9092
  type: ClusterIP
