server:
  port: ${SERVER_PORT:8082}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/arogya_patients?user=arogya&password=arogya_secret}
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:10MB}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

logging:
  level:
    org.hibernate.orm.core: ERROR
    org.hibernate.engine.transaction.jta.platform: ERROR
    org.springframework.security: WARN

patient:
  storage:
    upload-dir: ${PATIENT_STORAGE_UPLOAD_DIR:uploads}

services:
  prescription:
    url: ${PRESCRIPTION_SERVICE_URL:http://localhost:8085}
