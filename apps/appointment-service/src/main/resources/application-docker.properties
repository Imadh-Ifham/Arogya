spring.datasource.url=jdbc:postgresql://postgres:5432/arogya_appointments
spring.datasource.username=arogya
spring.datasource.password=${DB_PASSWORD:arogya_secret}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

spring.data.redis.host=redis

jwt.secret=${JWT_SECRET}

services.doctor.url=http://doctor-service:8082
services.payment.url=http://payment-service:3001
services.notification.url=http://notification-service:3002
services.telemedicine.url=http://telemedicine-service:8086
services.telemedicine.consultation-expiration-hours=24
