spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/arogya_appointments}
spring.datasource.username=${DB_USERNAME:arogya}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true

#spring.data.redis.host=localhost
#spring.data.redis.port=6379
management.health.redis.enabled=false


jwt.secret=${JWT_SECRET:dev_jwt_secret_replace_in_production_min_32_chars}

services.doctor.url=http://localhost:8082
services.payment.url=http://localhost:3001
services.notification.url=http://localhost:3002
services.telemedicine.url=http://localhost:8086
services.telemedicine.consultation-expiration-hours=24
