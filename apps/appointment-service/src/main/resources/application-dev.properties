spring.datasource.url=jdbc:postgresql://localhost:5432/arogya_appointments
spring.datasource.username=arogya
spring.datasource.password=arogya_secret
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true

#spring.data.redis.host=localhost
#spring.data.redis.port=6379
management.health.redis.enabled=false


jwt.secret=${JWT_SECRET:dev_jwt_secret_replace_in_production_min_32_chars}

services.doctor.url=http://localhost:8083
services.payment.url=http://localhost:3001
services.notification.url=http://localhost:3002
services.telemedicine.url=http://localhost:8086
