spring:
  application:
    name: doctor-service

# ==========================================
# PROFILE: LOCAL (For running in IntelliJ)
# ==========================================
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/arogya_doctors
    username: arogya
    password: arogya_secret
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9093

server:
  port: 8083

# ==========================================
# PROFILE: DOCKER (For running via docker-compose)
# ==========================================
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}

server:
  port: ${SERVER_PORT:8083}